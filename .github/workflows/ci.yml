name: ci
on: [push, pull_request]

jobs:
  # Every figure in README.md and FACTORY.md, against the evidence that produced it.
  # The room does not change, so a wrong number in a document can only mean the
  # document was not updated -- and this repository has shipped three of those. The
  # checker exits non-zero, which also rejects figures the repository has already
  # retracted, because a stale number can sit next to a correct one.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the stage-lock claims read git log
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 verify_claims.py
      - name: Regenerate the evidence table and fail if it moved
        run: |
          python3 verify_claims.py --markdown docs/EVIDENCE.md
          git diff --exit-code docs/EVIDENCE.md

  stages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # The way a judge builds a folder: from its Dockerfile, with nothing else.
      - name: Build stage-${{ matrix.stage }}
        run: docker build -t pocketful-stage${{ matrix.stage }} ./stage-${{ matrix.stage }}

      - name: Serve and check /health
        run: |
          docker run -d --name pf -p 8080:8080 -e PORT=8080 pocketful-stage${{ matrix.stage }}
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then
              echo "healthy after ${i}s"
              docker logs pf
              docker rm -f pf
              exit 0
            fi
            sleep 1
          done
          echo "did not become healthy within 60s"
          docker logs pf
          docker rm -f pf
          exit 1

  # Each stage folder must import cleanly on its own, since a judge only talks
  # to it over HTTP but a broken import means the image built from nothing.
  imports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r stage-${{ matrix.stage }}/requirements.txt
      - run: python3 -c "import src.app"
        working-directory: stage-${{ matrix.stage }}

  # The reviewer's own scenarios, re-run against every build. These are not the
  # event's checks: they are the notes the reviewer wrote, made executable so
  # that nobody has to take a verdict's word for it.
  scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r stage-${{ matrix.stage }}/requirements.txt

      - name: Serve stage-${{ matrix.stage }}
        run: |
          docker build -t scenario-stage${{ matrix.stage }} ./stage-${{ matrix.stage }}
          docker run -d --name pf -p 8080:8080 -e PORT=8080 scenario-stage${{ matrix.stage }}
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done

      - name: Run the reviewer's scenarios
        run: python3 holdouts/run_scenarios.py --base-url http://127.0.0.1:8080 --stage ${{ matrix.stage }}